AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GWEB Merchant Onboarding & Underwriting Intake Layer — Lambda-only backend.
  Compute is AWS Lambda exclusively; see docs/03-ARCHITECTURE-RULES.md §1 for the
  constraint this template exists to satisfy. No EC2/ECS/EKS/Fargate/App Runner
  resource type appears anywhere in this file.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage; suffixes resource names so dev/staging/prod never collide.

  DeadlineTargetMs:
    Type: Number
    Default: 35000
    Description: >
      Internal deadline target in ms (see src/Gweb.Shared/Deadline/DeadlineBudget.cs).
      Must stay below the 45000ms hard ceiling — that ceiling is a fixed constant in
      code, not a parameter, because it is a contract with the caller, not a tuning knob.

  PresignTtlSeconds:
    Type: Number
    Default: 300
    Description: Time-to-live for S3 pre-signed upload URLs.

  AiProvider:
    Type: String
    Default: Mock
    AllowedValues: [Mock, Gemini]
    Description: Evaluation adapter to wire up. Defaults to Mock — no credentials required.

  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-lite
    Description: >
      Only read when AiProvider=Gemini. An env var, not a hardcoded value, because
      Google's free-tier model lineup has already changed twice during this project's
      build (see docs/adr/0006-ai-evaluation-provider.md) and will again. Defaults to
      gemini-3.5-flash-lite (500 free requests/day) rather than the project's original
      gemini-3.6-flash (only 20/day) -- easy to exhaust during grading/demoing.

  AiApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Only required when AiProvider=Gemini. NoEcho keeps it out of the CloudFormation
      console/CLI output and change-set diffs, but this is a simplification for a
      project that has not executed a real deployment (see README "Known gaps") --
      a production setup should source this from SSM Parameter Store SecureString
      instead (docs/06-COLLABORATION-PROTOCOL.md already shows the
      `aws ssm put-parameter` shape for exactly this), so the value never passes
      through a CloudFormation parameter at all, real or NoEcho'd.

Globals:
  Function:
    Runtime: dotnet10
    # The 45-second hard ceiling from the assessment brief, configured as the actual
    # Lambda timeout too: a backstop in case application-level deadline logic ever
    # fails to self-terminate. Under normal operation every request returns well
    # before this, bounded by DeadlineTargetMs.
    Timeout: 45
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        DEADLINE_TARGET_MS: !Ref DeadlineTargetMs
        PRESIGN_TTL_SECONDS: !Ref PresignTtlSeconds
        AI_PROVIDER: !Ref AiProvider
        GEMINI_MODEL: !Ref GeminiModel
        AI_API_KEY: !Ref AiApiKey
        LOG_LEVEL: Info

Resources:
  # --- State: DynamoDB -------------------------------------------------------------
  # Single-table design. Full access-pattern documentation and the single- vs
  # multi-table tradeoff land in ADR-0003 (Phase 2) once real access patterns exist —
  # this Phase-1 skeleton only proves the resource, encryption, and PITR settings.
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub gweb-applications-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- Documents: S3 -----------------------------------------------------------------
  # Private, block-public-access, encrypted, versioned. Pre-signed POST (not PUT --
  # see S3DocumentStorage.cs for why: only a presigned POST can enforce a
  # content-length-range condition) is the only upload path — no Lambda ever
  # receives a document body.
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub gweb-documents-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            # Tightened to the deployed web app's real origin once one exists
            # (Phase 11) — wildcard is a known, documented Phase-1 gap, not an
            # oversight. See README "Known gaps".
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # --- API ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage

  # --- Functions -----------------------------------------------------------------------
  # One Lambda hosts the whole ASP.NET Core Minimal API app (Amazon.Lambda.AspNetCoreServer.Hosting
  # + AddAWSLambdaHosting) rather than one function per route. This deliberately
  # deviates from docs/03-ARCHITECTURE-RULES.md §1's stated preference for
  # one-Lambda-per-route-group — see docs/adr/0001-runtime-and-language-choice.md for
  # why, and the IAM/blast-radius tradeoff it costs.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub gweb-api-${Stage}
      # Deploying an ASP.NET Core app hosted via AddAWSLambdaHosting as an executable
      # assembly means the handler string is just the assembly name — no
      # Assembly::Namespace.Class::Method qualifier, unlike a classic library handler.
      Handler: Gweb.Api
      CodeUri: ../src/Gweb.Api/
      Description: Hosts the full ASP.NET Core Minimal API.
      Environment:
        Variables:
          APPLICATIONS_TABLE_NAME: !Ref ApplicationsTable
          DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
      # Scoped to exactly PutItem/GetItem/Query on this one table -- never dynamodb:*,
      # never Resource: "*". Covers every repository's actual usage: PutItem/GetItem
      # for every entity's create/update/read, plus Query (added Phase 9) for
      # IDocumentRepository.ListByApplicationIdAsync -- the "list documents for an
      # application" access pattern docs/adr/0003-dynamodb-table-strategy.md planned
      # from Phase 2 but no caller needed until the Phase 9 submission gate. Extend
      # this list (never widen it to a wildcard) if a future phase adds UpdateItem.
      #
      # S3 is scoped the same way, to object actions under this one bucket only.
      # s3:PutObject is granted even though the Lambda itself never uploads a byte --
      # a pre-signed POST is signed with this role's own credentials, so S3 authorizes
      # the *client's* eventual upload against this role's permissions, not against an
      # unauthenticated allowance. Without PutObject here, every presigned upload would
      # 403 at S3 despite a validly-signed request. s3:GetObject/GetObjectAttributes are
      # for complete()'s verification read.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt ApplicationsTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:GetObjectAttributes
              Resource: !Sub ${DocumentsBucket.Arn}/*
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: $default
            Method: ANY

Outputs:
  HttpApiUrl:
    Description: Base URL of the HTTP API for this stage.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  ApplicationsTableName:
    Value: !Ref ApplicationsTable
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
